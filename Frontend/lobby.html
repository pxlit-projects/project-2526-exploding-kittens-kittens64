<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
    <link rel="stylesheet" href="css/lobby.css">
</head>
<body>
    <main>
        <div class="lobby-container">
            <h1 class="lobby-title">Find a Table</h1>
            <p class="lobby-subtitle">Choose a game type and create or join a table</p>

            <p class="section-heading">Available Tables</p>
            <div id="table-list"></div>

            <hr class="divider">

            <div class="controls">
                <div class="control-row">
                    <div class="control-field">
                        <label for="game-type">GAME TYPE</label>
                        <select name="game-type" id="game-type">
                            <option value="Default Game">Default Game</option>
                        </select>
                    </div>
                    <div class="control-field">
                        <label for="total-players">PLAYERS AT TABLE: <span id="player-count-label">3</span></label>
                        <div class="slider-row">
                            <span>2</span>
                            <input type="range" min="2" max="5" value="3" id="total-players">
                            <span>5</span>
                        </div>
                    </div>
                </div>
                <div class="buttonTable-row">
                    <button class="buttonTable-primary" id="search">Search tables</button>
                    <button class="buttonTable-secondary" id="create-table">Create table</button>
                </div>
                <span id="error-message"></span>
            </div>

        </div>
    </main>
    <script src="scripts/lobby.js"></script>
</body>
</html>
