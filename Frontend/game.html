<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/game.css">
    <title>Document</title>
</head>
<body>
    <h1>Exploding Kittens</h1>
    <div id="status">
        <h2>Game ongoing</h2>
    </div>

    <div id="piles">
        <div class="draw">
            <h2>Draw</h2>
            <div id="drawPile"></div>
        </div>
        <div class="play">
            <h2>Play</h2>
            <div id="playPile"></div>
        </div>
    </div>

    <h2>My Cards</h2>
    <div id="myCards">
        <!-- Example Cards -->
        <img class="card" src="./images/cards/Attack-Bear-o-Dactyl.jpg" alt="">
        <img class="card" src="./images/cards/Defuse-Via-Belly-Rubs.jpg" alt="">
        <img class="card" src="./images/cards/Favor-Rub-Peanut-Butter-on-Your-Belly-Button.jpg" alt="">
        <img class="card" src="./images/cards/Nope-a-Nope-Ninja.jpg" alt="">
    </div>

    <h2>Opponents</h2>
    <div id="opponents">
        <!-- Example players -->
        <div class="opponent">
            <h3>player 2</h3>
            <p>5 cards</p>
        </div>
        <div class="opponent">
            <h3>player 3</h3>
            <p>3 cards</p>
        </div>
        <div class="opponent">
            <h3>player 4</h3>
            <p>7 cards</p>
        </div>
        <div class="opponent">
            <h3>player 5</h3>
            <p>6 cards</p>
        </div>
    </div>

    <script src="scripts/game.js"></script>
</body>
</html>
