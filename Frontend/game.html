<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/game.css">
    <title>Document</title>
</head>

<body>
    <main>
        <!-- <h1>Exploding Kittens</h1>
        <div id="status">
            <h2>Game ongoing</h2>
        </div> -->

        <div id="opponents">
        </div>

        <div id="piles">
            <div class="draw">
                <div id="drawPile"></div>
            </div>
            <div class="play">
                <div id="playPile"></div>
            </div>
            <div id="actionPanel">
            </div>
        </div>

        <div class="playerBar">
            <div id="myPlayer">
            </div>
            <div class="playerChat">
                <button id="openChat">
                    <img src="/Frontend/images/game_img/chat_icon.png" alt="">
                </button>
                <div id="chatPanel" hidden>
                    <div id="emojiContent">
                        <img src="images/emojis/cool_emoji.png" class="emoji-opt">
                        <img src="images/emojis/sad_emoji.png" class="emoji-opt">
                        <img src="images/emojis/vengeful_emoji.png" class="emoji-opt">
                        <img src="images/emojis/amused_emoji.png" class="emoji-opt">
                    </div>
                    <div id="textContent">
                        <input type="text" id="chatInput" placeholder="Type a message..." />
                        <button id="sendMessage">Send</button>
                    </div>
                </div>
            </div>
            <div id="futureCardsPanel">
            </div>
            <div id="myCards">
            </div>
            <div id="nopePanel">
            </div>
        </div>

    </main>
    <script src="scripts/game.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="scripts/chat.js"></script>
</body>

</html>
